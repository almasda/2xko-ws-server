<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2XKO Multiplayer Game</title>
<style>
body { margin:0; padding:0; overflow:hidden; background:#0a0a0a; font-family:sans-serif; }
canvas { display:block; margin:0 auto; background:#0a0a0a; }
#overlay { position:absolute; top:0; left:0; width:100%; height:100%; display:flex; justify-content:center; align-items:center; flex-direction:column; color:#0ff; font-size:2em; z-index:10; }
.button { margin-top:20px; padding:15px 30px; font-size:20px; cursor:pointer; background:#0ff; border:none; border-radius:10px; color:#000; }
#winScreen { display:none; flex-direction:column; align-items:center; justify-content:center; background: rgba(0,0,0,0.9); position:absolute; width:100%; height:100%; top:0; left:0; font-size:3em; color:#0ff; z-index:20; }
#healthBar { position:absolute; top:20px; left:50%; transform:translateX(-50%); width:600px; display:flex; justify-content:space-between; }
.health { width:250px; height:25px; background:rgba(255,255,255,0.2); border-radius:5px; overflow:hidden; }
.health-fill { height:100%; background:green; width:100%; transition: width 0.2s; }
#timer { position:absolute; top:60px; left:50%; transform:translateX(-50%); font-size:28px; color:#0ff; background:rgba(0,0,0,0.5); padding:5px 10px; border-radius:5px; }
</style>
</head>
<body>

<canvas id="gameCanvas" width="1920" height="911"></canvas>

<div id="overlay">
  <div id="lobbyScreen">
    <h1>LOBBY</h1>
    <button class="button" id="startSelect">FIND A MATCH</button>
  </div>
  <div id="charSelectScreen" style="display:none;">
    <h1>SELECT CHARACTER</h1>
    <div id="characters" style="display:flex; gap:20px;">
      <div class="char" data-color="cyan" style="width:100px;height:100px;background:cyan;cursor:pointer;"></div>
      <div class="char" data-color="magenta" style="width:100px;height:100px;background:magenta;cursor:pointer;"></div>
    </div>
    <button class="button" id="confirmChar">CONFIRM</button>
  </div>
</div>

<div id="winScreen">
  <div id="winnerText"></div>
  <button class="button" id="rematchBtn">REMATCH</button>
  <button class="button" id="backLobbyBtn">BACK TO LOBBY</button>
</div>

<div id="healthBar">
  <div class="health"><div class="health-fill" id="p1Health"></div></div>
  <div class="health"><div class="health-fill" id="p2Health"></div></div>
</div>
<div id="timer">60</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let localColor = null;
let remoteColor = null;
let gameState = 'lobby'; // lobby, select, fight, win
let timer = 60;

const overlay = document.getElementById('overlay');
const lobbyScreen = document.getElementById('lobbyScreen');
const charSelectScreen = document.getElementById('charSelectScreen');
const winScreen = document.getElementById('winScreen');
const winnerText = document.getElementById('winnerText');

const p1HealthFill = document.getElementById('p1Health');
const p2HealthFill = document.getElementById('p2Health');
const timerEl = document.getElementById('timer');

let localPlayer = {x:400,y:500,w:50,h:50,health:100};
let remotePlayer = {x:700,y:500,w:50,h:50,health:100};
const keys = {};

const ws = new WebSocket('wss://2xko-ws-server-production.up.railway.app');
ws.onopen = () => console.log('Connected to WebSocket Railway');
ws.onmessage = e => {
  const data = JSON.parse(e.data);
  if(data.type==='state') {
    remotePlayer = data.remote;
    localPlayer = data.local;
  }
  if(data.type==='win') {
    showWinScreen(data.winner);
  }
};

function sendState() {
  ws.send(JSON.stringify({type:'state',local:localPlayer,remote:remotePlayer}));
}

// --- Lobby & Character Select ---
document.getElementById('startSelect').onclick = () => {
  lobbyScreen.style.display = 'none';
  charSelectScreen.style.display = 'flex';
  gameState = 'select';
};

document.querySelectorAll('.char').forEach(el=>{
  el.onclick = () => {
    localColor = el.dataset.color;
    remoteColor = (localColor==='cyan')?'magenta':'cyan';
    document.querySelectorAll('.char').forEach(c=>c.style.outline='');
    el.style.outline = '5px solid yellow';
  };
});

document.getElementById('confirmChar').onclick = () => {
  if(!localColor) return alert('Pilih karakter dulu!');
  charSelectScreen.style.display='none';
  overlay.style.display='none';
  gameState='fight';
};

// --- Win Screen ---
document.getElementById('rematchBtn').onclick = () => location.reload();
document.getElementById('backLobbyBtn').onclick = () => location.reload();

// --- Keyboard ---
document.addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);
document.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);

// --- Game loop ---
function update() {
  if(gameState==='fight'){
    if(keys['a']) localPlayer.x -=5;
    if(keys['d']) localPlayer.x +=5;
    if(keys['f'] && Math.abs(localPlayer.x-remotePlayer.x)<60) {
      remotePlayer.health -=1;
      sendState();
    }
    if(keys['arrowleft']) remotePlayer.x -=5;
    if(keys['arrowright']) remotePlayer.x +=5;

    timer -=0.016;
    if(localPlayer.health<=0 || remotePlayer.health<=0 || timer<=0){
      const winner = (localPlayer.health>remotePlayer.health)?'PLAYER 1':'PLAYER 2';
      showWinScreen(winner);
      gameState='win';
    }

    p1HealthFill.style.width = localPlayer.health*2+'px';
    p2HealthFill.style.width = remotePlayer.health*2+'px';
    timerEl.innerText = Math.floor(timer);
    sendState();
  }
}

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  if(gameState==='fight'){
    ctx.fillStyle = localColor || 'cyan';
    ctx.fillRect(localPlayer.x,localPlayer.y,localPlayer.w,localPlayer.h);
    ctx.fillStyle = remoteColor || 'magenta';
    ctx.fillRect(remotePlayer.x,remotePlayer.y,remotePlayer.w,remotePlayer.h);
  }
  requestAnimationFrame(draw);
}

function showWinScreen(winner){
  winnerText.innerText = winner + ' WINS!';
  winScreen.style.display='flex';
}

function loop(){
  update();
  requestAnimationFrame(loop);
}

loop();
draw();
</script>
</body>
</html>
